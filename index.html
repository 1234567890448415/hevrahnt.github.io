<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hevrah NT - סטודיו פרטי לשירותי סרטים</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      direction: rtl;
      text-align: center;
      background: #f5f5f5;
      margin: 0;
      padding: 40px 20px;
      color: #333;
    }
    h1 {
      color: #0055aa;
      margin-bottom: 10px;
    }
    p {
      font-size: 1.1em;
      margin-bottom: 25px;
    }
    .cube-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      margin: 40px auto;
    }
    .cube-label {
      font-weight: 600;
      color: #003d75;
      letter-spacing: 0.5px;
    }
    .cube-scene {
      width: 220px;
      height: 220px;
      perspective: 800px;
    }
    .cube {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 40px auto 0;
      transform-style: preserve-3d;
      animation: spin 12s infinite linear;
    }
    .cube-face {
      position: absolute;
      width: 140px;
      height: 140px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 4px;
      padding: 8px;
      box-sizing: border-box;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.7);
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.15);
    }
    .cube-face span {
      display: block;
      border-radius: 6px;
      box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.2);
    }
    .front { transform: translateZ(70px); }
    .back { transform: rotateY(180deg) translateZ(70px); }
    .right { transform: rotateY(90deg) translateZ(70px); }
    .left { transform: rotateY(-90deg) translateZ(70px); }
    .top { transform: rotateX(90deg) translateZ(70px); }
    .bottom { transform: rotateX(-90deg) translateZ(70px); }
    .front span { background: #ff3b30; }
    .back span { background: #007aff; }
    .right span { background: #34c759; }
    .left span { background: #ffcc00; }
    .top span { background: #ffffff; border: 1px solid #ddd; }
    .bottom span { background: #ff9500; }
    @keyframes spin {
      0% { transform: rotateX(-20deg) rotateY(0deg); }
      100% { transform: rotateX(-20deg) rotateY(360deg); }
    }
    a.email-button {
      display: inline-block;
      padding: 12px 25px;
      font-size: 1em;
      color: white;
      background-color: #0055aa;
      border-radius: 6px;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }
    a.email-button:hover {
      background-color: #003d75;
    }
    footer {
      margin-top: 50px;
      font-size: 0.9em;
      color: #777;
    }
  </style>
</head>
<body>
  <h1>Hevrah NT</h1>
  <p>סטודיו פרטי לשירותי סרטים</p>
  <section class="cube-stage" aria-label="קובייה הונגרית תלת-ממדית">
    <div class="cube-label">קובייה הונגרית תלת-ממדית</div>
    <div class="cube-scene">
      <div class="cube" role="img" aria-label="קובייה מסתובבת תלת-ממדית">
        <div class="cube-face front">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>
        <div class="cube-face back">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>
        <div class="cube-face right">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>
        <div class="cube-face left">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>
        <div class="cube-face top">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>
        <div class="cube-face bottom">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </section>
  <a class="email-button" href="mailto:hevrah.nt@gmail.com">שלח/י לנו מייל</a>
  <footer>© 2025 Hevrah NT. כל הזכויות שמורות.</footer>
</body>
</html>
